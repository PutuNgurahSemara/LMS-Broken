; ==============================================================================
; File Konfigurasi Supervisor untuk Laravel Queue Worker (KampusLMS)
; Lokasi Deployment Server: /etc/supervisor/conf.d/kampuslms-worker.conf
; ==============================================================================

[program:kampuslms-worker]
; Format penamaan sub-proses saat numprocs > 1 (kampuslms-worker_00, kampuslms-worker_01)
process_name=%(program_name)s_%(process_num)02d

; Perintah eksekusi worker antrean Laravel:
; - database: Menggunakan queue connection database (tabel jobs)
; - --sleep=3: Menunggu 3 detik bila antrean kosong untuk menghemat CPU
; - --tries=3: Batas percobaan maksimal sebelum job masuk ke failed_jobs
; - --max-time=3600: Worker restart tiap 1 jam untuk mencegah memory leak
command=php /var/www/kampuslms/artisan queue:work database --sleep=3 --tries=3 --max-time=3600

; Menjalankan worker secara otomatis saat daemon Supervisor / OS booting
autostart=true

; Otomatis me-restart worker jika proses crash atau keluar karena 'queue:restart'
autorestart=true

; Mengirim sinyal stop (SIGTERM) dan kill (SIGKILL) ke seluruh grup proses anak
stopasgroup=true
killasgroup=true

; Menjalankan worker di bawah pengguna web server non-root (prinsip Least Privilege)
user=www-data

; Jumlah worker proses paralel yang dijalankan
numprocs=2

; Menggabungkan stderr ke stdout log
redirect_stderr=true

; Jalur penyimpanan log eksekusi worker
stdout_logfile=/var/log/supervisor/kampuslms-worker.log

; Waktu toleransi (detik) agar worker menyelesaikan job aktif sebelum dipaksa berhenti
stopwaitsecs=3600
